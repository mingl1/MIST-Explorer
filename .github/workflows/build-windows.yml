name: Build Windows

on:
  push:
    branches: [main, stable]
  pull_request:
    branches: [main, stable]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.10.17"

      - name: Install Visual C++ Redistributable
        run: choco install vcredist140 -y

      - name: Install UPX
        run: choco install upx -y

      - name: Install dependencies
        run: uv sync --frozen --extra build

      - name: Build with PyInstaller
        run: uv run pyinstaller MIST-Explorer-Windows.spec

      - name: Zip folder distribution
        shell: pwsh
        run: Compress-Archive -Path dist\MIST-Explorer -DestinationPath dist\MIST-Explorer-folder.zip

      - name: Upload standalone exe
        uses: actions/upload-artifact@v4
        with:
          name: MIST-Explorer-exe
          path: dist\MIST-Explorer.exe

      - name: Upload folder distribution
        uses: actions/upload-artifact@v4
        with:
          name: MIST-Explorer-folder
          path: dist\MIST-Explorer-folder.zip
