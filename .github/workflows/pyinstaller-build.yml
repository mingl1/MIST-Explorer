name: PyInstaller Build

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install Visual C++ 2010 Redistributable (for MSVCR100.dll)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://download.microsoft.com/download/1/1/1/111D3A9F-94F0-4C1A-9B3F-891C1C5B95EF/vcredist_x64.exe" -OutFile "vcredist_x64.exe"
          Start-Process .\vcredist_x64.exe /quiet /norestart -Wait

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      
      - name: Build with PyInstaller (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          pyinstaller main.py --onefile --windowed --name "MIST-Explorer" --add-data "assets:assets"

      - name: Build with PyInstaller (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller main.py --windowed --name "MIST-Explorer" --add-data "assets;assets"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-build
          path: dist/*
